[project]
name = "avia-analysis"
version = "0.1.0"
description = "Analysis and ML experiments for AVIA (dataset evaluation, calibration, model training) — separate from the backend so pandas/scikit-learn/PyTorch don't become API dependencies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
