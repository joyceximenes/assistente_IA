[project]
name = "avia-backend"
version = "0.1.0"
description = "API do AVIA — Assistente Visual Acessível (OCR via OCR.space, reconhecimento de objetos via Hugging Face Inference API)"
requires-python = ">=3.11"
dependencies = [
    # fastapi[standard] já traz uvicorn, python-multipart (uploads), httpx e a CLI `fastapi`
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pillow>=10.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.fastapi]
# Permite rodar só `fastapi dev` / `fastapi run` de dentro de backend/
entrypoint = "src.main:app"

[tool.uv]
# O app é executado pelo caminho de módulo (src.main:app), não instalado como
# pacote — então o uv só gerencia as dependências.
package = false

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erros)
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes — imports/variáveis não usados, etc.
    "I",    # isort — ordenação de imports
    "B",    # flake8-bugbear — armadilhas comuns (mutable default, etc.)
    "UP",   # pyupgrade — sintaxe moderna para o Python alvo
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # linha longa — o formatter já cuida disso na maioria dos casos
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]
# Atalhos de tarefa. Rodar com: uv run poe <nome>
test = "pytest -v"
coverage = "pytest --cov --cov-report=term-missing"
lint = "ruff check ."

[tool.coverage.run]
# Mede só o código da aplicação; sem isso o relatório inclui os próprios testes.
source = ["src"]
# Fora do relatório: código sem lógica própria para testar. O percentual passa a
# medir só o que se pretende cobrir, em vez de diluir com o que nunca terá teste.
omit = [
    "*/__init__.py",      # vazios, só marcam pacote
    "src/main.py",        # monta o app e o CORS
    "src/api/schemas.py", # declaração Pydantic; quem valida é a biblioteca
    "src/core/config.py", # leitura de variável de ambiente
    "src/core/logging.py",# configuração do logger
]

[tool.coverage.report]
# Mostra a coluna Missing com as linhas que nenhum teste executou.
show_missing = true
